name: Daily heartbeat

on:
  schedule:
    - cron: '7 6 * * *'
      timezone: Africa/Nairobi
    - cron: '7 12 * * *'
      timezone: Africa/Nairobi
    - cron: '7 18 * * *'
      timezone: Africa/Nairobi
  workflow_dispatch:
    inputs:
      milestone:
        description: Which heartbeat should be recorded?
        required: true
        default: auto
        type: choice
        options:
          - auto
          - morning
          - afternoon
          - evening

permissions:
  contents: write

concurrency:
  group: daycount-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MILESTONE: ${{ inputs.milestone || 'auto' }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_ACTOR_ID: ${{ github.actor_id }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record heartbeat and refresh README
        id: heartbeat
        run: npm run heartbeat

      - name: Commit and push the heartbeat
        env:
          COMMIT_MESSAGE: ${{ steps.heartbeat.outputs.commit_message }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add data/counter.json data/history.json README.md
          if git diff --cached --quiet; then
            echo "No new milestone data. Skipping duplicate commit."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
